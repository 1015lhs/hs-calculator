<!DOCTYPE html>

<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>京东购物金优惠计算器</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700;900&family=DM+Mono:wght@400;500;600&display=swap');
:root {
  --red:#E31C25; --red-bg:#FFF0F0;
  --gold:#D97706; --gold-bg:#FFFBEB;
  --green:#059669; --green-bg:#ECFDF5;
  --blue:#2563EB; --blue-bg:#EFF6FF;
  --orange:#EA580C; --orange-bg:#FFF7ED;
  --dark:#111827; --gray:#6B7280; --gray2:#9CA3AF;
  --light:#F3F4F6; --border:#E5E7EB;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Noto Sans SC',sans-serif;background:#F4F1ED;min-height:100vh;padding:20px 14px 64px;color:var(--dark);}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse at 15% 10%,rgba(227,28,37,.07) 0%,transparent 45%),radial-gradient(ellipse at 85% 85%,rgba(37,99,235,.06) 0%,transparent 45%);pointer-events:none;z-index:0;}
.wrap{position:relative;z-index:1;max-width:460px;margin:0 auto;}

/* Header */
.hdr{text-align:center;margin-bottom:18px;animation:dn .4s ease both;}
.badge{display:inline-flex;align-items:center;gap:4px;background:var(--red);color:#fff;font-size:10px;font-weight:700;letter-spacing:2px;padding:3px 11px;border-radius:20px;margin-bottom:7px;}
.hdr h1{font-size:22px;font-weight:900;line-height:1.2;}
.hdr p{font-size:12px;color:var(--gray);margin-top:4px;}

/* Plan pills */
.pills{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px;animation:dn .4s .07s ease both;}
.pill{border-radius:12px;padding:11px 10px;text-align:center;border:1.5px solid;}
.pill.a{background:var(--red-bg);border-color:#FECACA;}
.pill.b{background:var(--blue-bg);border-color:#BFDBFE;}
.pill-tag{font-size:9px;font-weight:800;letter-spacing:2px;opacity:.65;margin-bottom:2px;}
.pill.a .pill-tag{color:var(--red);}
.pill.b .pill-tag{color:var(--blue);}
.pill-amt{font-size:20px;font-weight:900;}
.pill.a .pill-amt{color:var(--red);}
.pill.b .pill-amt{color:var(--blue);}
.pill-sub{font-size:11px;color:var(--gray);margin-top:1px;}
.pill-chip{display:inline-block;font-size:10px;font-weight:700;padding:1px 8px;border-radius:8px;margin-top:4px;color:#fff;}
.pill.a .pill-chip{background:var(--red);}
.pill.b .pill-chip{background:var(--blue);}
.pill-max{font-size:10px;color:var(--gray2);margin-top:3px;}

.notice{background:var(--gold-bg);border:1px solid #FDE68A;border-radius:10px;padding:8px 12px;font-size:11px;color:#92400E;text-align:center;margin-bottom:13px;line-height:1.6;animation:dn .4s .1s ease both;}

/* Cards */
.card{background:#fff;border-radius:18px;padding:18px 16px;box-shadow:0 1px 12px rgba(0,0,0,.07);margin-bottom:11px;}
.card-anim{animation:up .4s .12s ease both;}
.ctitle{font-size:10px;font-weight:700;letter-spacing:1.5px;color:var(--gray2);margin-bottom:14px;display:flex;align-items:center;gap:6px;}
.ctitle::after{content:'';flex:1;height:1px;background:var(--border);}
.field{margin-bottom:14px;}
.field:last-child{margin-bottom:0;}
.field label{display:block;font-size:11px;font-weight:700;color:var(--gray);letter-spacing:.8px;margin-bottom:7px;}
.inp-wrap{position:relative;}
.inp-pre{position:absolute;left:13px;top:50%;transform:translateY(-50%);font-size:16px;font-weight:700;color:var(--gray2);pointer-events:none;}
.inp-suf{position:absolute;right:13px;top:50%;transform:translateY(-50%);font-size:12px;color:var(--gray2);pointer-events:none;}
input[type=number]{width:100%;border:2px solid var(--border);border-radius:11px;padding:12px 44px 12px 32px;font-size:19px;font-weight:700;font-family:'DM Mono',monospace;color:var(--dark);background:var(--light);outline:none;transition:border-color .18s,box-shadow .18s,background .18s;-moz-appearance:textfield;}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;}
input[type=number]:focus{border-color:var(--red);background:#fff;box-shadow:0 0 0 3px rgba(227,28,37,.09);}
.stepper{display:flex;align-items:center;background:var(--light);border:2px solid var(--border);border-radius:11px;overflow:hidden;}
.sbtn{width:46px;height:48px;border:none;background:none;font-size:20px;color:var(--gray);cursor:pointer;font-weight:300;transition:background .14s,color .14s;flex-shrink:0;}
.sbtn:hover{background:var(--red-bg);color:var(--red);}
.sval{flex:1;text-align:center;font-size:20px;font-weight:700;font-family:'DM Mono',monospace;border:none;background:none;outline:none;}

/* Discount sections (coupon + hongbao) */
.disc-card{background:#fff;border-radius:18px;box-shadow:0 1px 12px rgba(0,0,0,.07);margin-bottom:11px;overflow:hidden;animation:up .4s .17s ease both;}
.disc-tabs{display:grid;grid-template-columns:1fr 1fr;}
.disc-tab{padding:12px 10px;text-align:center;cursor:pointer;border-bottom:2px solid var(--border);font-size:12px;font-weight:600;color:var(--gray2);transition:all .18s;display:flex;align-items:center;justify-content:center;gap:5px;}
.disc-tab.active-coupon{border-bottom-color:var(--gold);color:var(--gold);background:var(--gold-bg);}
.disc-tab.active-hb{border-bottom-color:var(--orange);color:var(--orange);background:var(--orange-bg);}
.disc-body{padding:14px 16px;}

/* coupon rows */
.disc-list{display:flex;flex-direction:column;gap:8px;margin-bottom:10px;}
.disc-row{display:flex;align-items:center;gap:8px;}
.disc-inp-group{flex:1;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:0;background:var(--light);border:2px solid var(--border);border-radius:11px;padding:0 10px;}
.disc-inp-group:focus-within{border-color:var(--gold);background:#fff;box-shadow:0 0 0 3px rgba(217,119,6,.08);}
.disc-inp-group.hb:focus-within{border-color:var(--orange);box-shadow:0 0 0 3px rgba(234,88,12,.08);}
.disc-inp-group input{border:none;background:none;outline:none;font-size:15px;font-weight:700;font-family:'DM Mono',monospace;color:var(--dark);padding:11px 0;width:100%;min-width:0;-moz-appearance:textfield;}
.disc-inp-group input::-webkit-inner-spin-button,.disc-inp-group input::-webkit-outer-spin-button{-webkit-appearance:none;}
.disc-sep{padding:0 6px;font-size:12px;font-weight:700;color:var(--gray2);white-space:nowrap;}
.disc-del{width:32px;height:32px;border:none;background:var(--light);border-radius:8px;cursor:pointer;font-size:14px;color:var(--gray);display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:background .14s,color .14s;}
.disc-del:hover{background:#FEE2E2;color:var(--red);}
.disc-add{width:100%;border:2px dashed var(--border);background:none;border-radius:10px;padding:9px;font-size:12px;font-weight:600;color:var(--gray);cursor:pointer;font-family:'Noto Sans SC',sans-serif;transition:all .14s;}
.disc-add.coupon-add:hover{border-color:var(--gold);color:var(--gold);background:var(--gold-bg);}
.disc-add.hb-add:hover{border-color:var(--orange);color:var(--orange);background:var(--orange-bg);}
.disc-hint{font-size:10px;color:var(--gray2);margin-top:8px;text-align:center;line-height:1.5;}

/* hongbao simple input (just flat amount) */
.hb-flat{display:flex;align-items:center;gap:8px;}
.hb-flat .disc-inp-group{grid-template-columns:auto 1fr;}

/* Tab switch */
.tab-panel{display:none;}
.tab-panel.show{display:block;}

/* Calc btn */
.btn{width:100%;background:var(--red);color:#fff;border:none;border-radius:13px;padding:15px;font-size:15px;font-weight:700;font-family:'Noto Sans SC',sans-serif;cursor:pointer;letter-spacing:2px;box-shadow:0 4px 14px rgba(227,28,37,.28);transition:transform .14s,box-shadow .14s,background .14s;animation:up .4s .22s ease both;}
.btn:hover{background:#C41219;transform:translateY(-1px);box-shadow:0 6px 18px rgba(227,28,37,.32);}
.btn:active{transform:translateY(0);}

/* Results */
.results{display:none;}
.results.show{display:block;animation:up .38s ease both;}
.sec{text-align:center;font-size:10px;font-weight:700;letter-spacing:2.5px;color:var(--gray2);margin:18px 0 10px;}

/* Best box */
.best-box{background:linear-gradient(135deg,#ECFDF5,#D1FAE5);border:2px solid #6EE7B7;border-radius:18px;padding:18px 16px;margin-bottom:8px;position:relative;overflow:hidden;}
.best-box::before{content:'';position:absolute;top:-30px;right:-30px;width:100px;height:100px;border-radius:50%;background:rgba(5,150,105,.1);}
.best-crown-bar{display:flex;align-items:center;gap:6px;font-size:10px;font-weight:800;letter-spacing:1.5px;color:var(--green);margin-bottom:12px;}
.best-split{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;}
.best-plan-name{font-size:13px;font-weight:700;color:var(--dark);margin-bottom:4px;}
.best-combo-tags{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:8px;}
.ctag{display:inline-flex;align-items:center;font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;}
.ctag.a{background:var(--red-bg);color:var(--red);border:1px solid #FECACA;}
.ctag.b{background:var(--blue-bg);color:var(--blue);border:1px solid #BFDBFE;}
.ctag.maxed{opacity:.6;}
.best-stats{display:flex;gap:10px;flex-wrap:wrap;}
.bstat{font-size:11px;color:var(--gray);}
.bstat strong{color:var(--dark);font-family:'DM Mono',monospace;}
.best-right{text-align:right;}
.best-price-label{font-size:10px;color:var(--gray);margin-bottom:2px;}
.best-price{font-size:34px;font-weight:900;font-family:'DM Mono',monospace;color:var(--green);line-height:1;letter-spacing:-1px;}
.best-price .yen{font-size:14px;font-weight:600;vertical-align:super;letter-spacing:0;}
.best-orig{font-size:11px;color:var(--gray2);text-decoration:line-through;margin-top:3px;}
.best-save-chip{display:inline-block;background:var(--green);color:#fff;font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px;margin-top:6px;}
.best-breakdown{margin-top:12px;border-top:1px dashed #6EE7B7;padding-top:10px;display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;}
.bbd{font-size:10.5px;color:var(--gray);display:flex;justify-content:space-between;}
.bbd strong{font-family:'DM Mono',monospace;color:var(--dark);font-weight:600;}
.best-refund{margin-top:10px;padding:8px 10px;border-radius:9px;background:rgba(5,150,105,.08);border:1px dashed #6EE7B7;font-size:11px;color:var(--green);display:flex;justify-content:space-between;align-items:center;}
.best-refund strong{font-family:'DM Mono',monospace;}
.bonus-bars{margin-top:12px;border-top:1px dashed #6EE7B7;padding-top:10px;display:flex;flex-direction:column;gap:7px;}
.bbar-row{display:flex;align-items:center;gap:8px;}
.bbar-label{font-size:10px;font-weight:700;width:36px;flex-shrink:0;}
.bbar-label.a{color:var(--red);}
.bbar-label.b{color:var(--blue);}
.bbar-track{flex:1;height:8px;background:var(--light);border-radius:8px;overflow:hidden;}
.bbar-fill{height:100%;border-radius:8px;transition:width .7s cubic-bezier(.34,1.56,.64,1);}
.bbar-fill.a{background:var(--red);}
.bbar-fill.b{background:var(--blue);}
.bbar-val{font-size:10px;font-family:'DM Mono',monospace;color:var(--gray);width:60px;text-align:right;flex-shrink:0;}

/* Discount summary block */
.disc-summary{margin-top:10px;border-radius:12px;overflow:hidden;border:1px solid #FDE68A;}
.disc-summary-title{background:var(--gold-bg);padding:7px 12px;font-size:10px;font-weight:800;letter-spacing:1px;color:var(--gold);display:flex;align-items:center;gap:5px;}
.disc-summary-body{background:#fff;padding:10px 12px;display:flex;flex-direction:column;gap:5px;}
.ds-row{display:flex;justify-content:space-between;align-items:center;font-size:10.5px;color:var(--gray);}
.ds-row strong{font-family:'DM Mono',monospace;color:var(--dark);}
.ds-row.coupon-row strong{color:var(--gold);}
.ds-row.hb-row strong{color:var(--orange);}
.ds-divider{border-top:1px dashed var(--border);margin:3px 0;}
.ds-total{font-size:12px;font-weight:700;color:var(--green);display:flex;justify-content:space-between;}
.ds-total span{font-family:'DM Mono',monospace;}

/* Final price hero */
.final-hero{margin-top:10px;background:linear-gradient(135deg,#FFFBEB,#FEF3C7);border:2px solid #FDE68A;border-radius:14px;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;}
.fh-left .fh-label{font-size:12px;font-weight:800;color:var(--gold);}
.fh-left .fh-sub{font-size:10px;color:var(--gray);margin-top:3px;line-height:1.4;}
.fh-right{text-align:right;}
.fh-price{font-size:36px;font-weight:900;font-family:'DM Mono',monospace;color:var(--gold);line-height:1;letter-spacing:-1.5px;}
.fh-price .yen{font-size:15px;font-weight:600;vertical-align:super;letter-spacing:0;}
.fh-save{font-size:11px;color:var(--gold);margin-top:4px;font-weight:600;}

/* Runner cards */
.runners{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px;}
.runner-card{background:#fff;border-radius:14px;padding:14px 12px;box-shadow:0 1px 8px rgba(0,0,0,.05);border-top:3px solid var(--border);position:relative;}
.runner-card.r0{border-top-color:var(--red);}
.runner-card.r1{border-top-color:var(--blue);}
.runner-card.r2{border-top-color:#7C3AED;}
.runner-rank{position:absolute;top:10px;right:10px;font-size:9px;font-weight:700;color:var(--gray2);}
.runner-name{font-size:9px;font-weight:800;letter-spacing:1px;color:var(--gray);margin-bottom:5px;}
.rtags{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:7px;}
.rtag{font-size:9px;font-weight:700;padding:2px 6px;border-radius:6px;}
.rtag.a{background:var(--red-bg);color:var(--red);}
.rtag.b{background:var(--blue-bg);color:var(--blue);}
.runner-price-label{font-size:10px;color:var(--gray);margin-bottom:2px;}
.runner-price{font-size:24px;font-weight:900;font-family:'DM Mono',monospace;color:var(--dark);line-height:1;}
.runner-price .yen{font-size:12px;font-weight:600;vertical-align:super;}
.runner-extra{font-size:10px;color:var(--gray);margin-top:4px;}
.runner-extra b{color:var(--red);}
.runner-details{border-top:1px solid var(--light);padding-top:8px;margin-top:8px;}
.dr{display:flex;justify-content:space-between;font-size:10px;color:var(--gray);margin-bottom:4px;}
.dr:last-child{margin-bottom:0;}
.dr strong{font-family:'DM Mono',monospace;font-weight:600;color:var(--dark);}
.dr .rv{color:var(--green)!important;}

.tip{background:#fff;border-radius:12px;padding:12px 14px;box-shadow:0 1px 8px rgba(0,0,0,.05);font-size:11px;color:var(--gray);line-height:1.7;text-align:center;}
.tip b{color:var(--dark);}

@keyframes dn{from{opacity:0;transform:translateY(-12px)}to{opacity:1;transform:translateY(0)}}
@keyframes up{from{opacity:0;transform:translateY(12px)} to{opacity:1;transform:translateY(0)}}
</style>

</head>
<body>
<div class="wrap">

  <!-- Header -->

  <div class="hdr">
    <div class="badge">🛍 京东购物金</div>
    <h1>充值优惠计算器</h1>
    <p>自动推荐最划算的充值组合</p>
  </div>

  <!-- Plan pills -->

  <div class="pills">
    <div class="pill a">
      <div class="pill-tag">方案 A</div>
      <div class="pill-amt">¥300</div>
      <div class="pill-sub">每张送 ¥15赠金</div>
      <div class="pill-chip">上限 5次</div>
      <div class="pill-max">最多到手 ¥1,575</div>
    </div>
    <div class="pill b">
      <div class="pill-tag">方案 B</div>
      <div class="pill-amt">¥500</div>
      <div class="pill-sub">每张送 ¥35赠金</div>
      <div class="pill-chip">上限 5次</div>
      <div class="pill-max">最多到手 ¥2,675</div>
    </div>
  </div>

  <div class="notice">
    ⚠️ 每充1张赠1次 · A每次+¥15，上限5次（共+¥75）· B每次+¥35，上限5次（共+¥175）
  </div>

  <!-- Main inputs -->

  <div class="card card-anim">
    <div class="ctitle">购买信息</div>
    <div class="field">
      <label>单套商品金额</label>
      <div class="inp-wrap">
        <span class="inp-pre">¥</span>
        <input type="number" id="perItem" placeholder="0" min="0" step="0.01">
        <span class="inp-suf">元/套</span>
      </div>
    </div>
    <div class="field">
      <label>购买套数</label>
      <div class="stepper">
        <button class="sbtn" onclick="chg(-1)">−</button>
        <input class="sval" type="number" id="qty" value="1" min="1" max="99" readonly>
        <button class="sbtn" onclick="chg(1)">+</button>
      </div>
    </div>
  </div>

  <!-- Discount card: coupon + hongbao tabs -->

  <div class="disc-card">
    <div class="disc-tabs">
      <div class="disc-tab active-coupon" id="tabCoupon" onclick="switchTab('coupon')">
        🎟 优惠券
      </div>
      <div class="disc-tab" id="tabHb" onclick="switchTab('hb')">
        🧧 店铺红包
      </div>
    </div>
    <div class="disc-body">

      <!-- Coupon panel -->
      <div class="tab-panel show" id="panelCoupon">
        <div class="disc-list" id="couponList"></div>
        <button class="disc-add coupon-add" onclick="addCoupon()">＋ 添加优惠券</button>
        <div class="disc-hint">填写满减条件，如「满319减10」填 319 和 10<br>每套商品单独判断是否满足门槛，可添加多张</div>
      </div>

      <!-- Hongbao panel -->
      <div class="tab-panel" id="panelHb">
        <div class="disc-list" id="hbList"></div>
        <button class="disc-add hb-add" onclick="addHb()">＋ 添加红包</button>
        <div class="disc-hint">红包直接填写面值，无门槛直接抵扣<br>若有门槛请同时填写满减条件</div>
      </div>

    </div>
  </div>

<button class="btn" onclick="calc()">智能推荐最优方案 →</button>

  <!-- Results -->

  <div class="results" id="results">
    <div class="sec">── 最优推荐 ──</div>
    <div id="bestBox"></div>
    <div class="sec">── 其他方案对比 ──</div>
    <div class="runners" id="runners"></div>
    <div class="tip" id="tipBox"></div>
  </div>

</div>
<script>
const PA = { charge:300, bonusPerCard:15, maxBonus:5 };
const PB = { charge:500, bonusPerCard:35, maxBonus:5 };
const fmt = n => n.toFixed(2);

// ── Tab switch ──
let activeTab = 'coupon';
function switchTab(t) {
activeTab = t;
document.getElementById('panelCoupon').classList.toggle('show', t==='coupon');
document.getElementById('panelHb').classList.toggle('show', t==='hb');
document.getElementById('tabCoupon').className = 'disc-tab' + (t==='coupon' ? ' active-coupon' : '');
document.getElementById('tabHb').className     = 'disc-tab' + (t==='hb'     ? ' active-hb'     : '');
}

// ── Coupon rows ──
let couponId = 0;
function addCoupon() {
const id = ++couponId;
const row = document.createElement('div');
row.className = 'disc-row'; row.id = `coup${id}`;
row.innerHTML = ` <div class="disc-inp-group" style="grid-template-columns:1fr auto 1fr"> <input type="number" id="cmin${id}" placeholder="满" min="0" step="0.01" title="满额"> <span class="disc-sep">减</span> <input type="number" id="coff${id}" placeholder="减" min="0" step="0.01" title="减额"> </div> <button class="disc-del" onclick="this.parentElement.remove()">✕</button>`;
document.getElementById('couponList').appendChild(row);
}

// ── Hongbao rows ──
let hbId = 0;
function addHb() {
const id = ++hbId;
const row = document.createElement('div');
row.className = 'disc-row'; row.id = `hb${id}`;
row.innerHTML = ` <div class="disc-inp-group hb"> <input type="number" id="hbmin${id}" placeholder="满（无门槛填0）" min="0" step="0.01" title="满额（0=无门槛）"> <span class="disc-sep">减</span> <input type="number" id="hboff${id}" placeholder="红包面值" min="0" step="0.01" title="面值"> </div> <button class="disc-del" onclick="this.parentElement.remove()">✕</button>`;
document.getElementById('hbList').appendChild(row);
}

// Read coupons (min+off) & hongbao (min+off)
function readCoupons() {
const rows = document.getElementById('couponList').querySelectorAll('.disc-row');
const out = [];
rows.forEach(r => {
const mn  = parseFloat(r.querySelector('[id^="cmin"]').value) || 0;
const off = parseFloat(r.querySelector('[id^="coff"]').value) || 0;
if (off > 0) out.push({ min: mn, off });
});
return out;
}
function readDiscs(listId, minPrefix, offPrefix) {
const rows = document.getElementById(listId).querySelectorAll('.disc-row');
const out = [];
rows.forEach(r => {
const mn  = parseFloat(r.querySelector('[id^="'+minPrefix+'"]').value) || 0;
const off = parseFloat(r.querySelector('[id^="'+offPrefix+'"]').value) || 0;
if (off > 0) out.push({ min: mn, off });
});
return out;
}

// Apply discounts once against the TOTAL order price → {totalOff, applied[]}
function applyDiscs(orderTotal, discs) {
let totalOff = 0;
const applied = [];
for (const d of discs) {
if (orderTotal >= d.min) { totalOff += d.off; applied.push(d); }
}
return { totalOff, applied };
}

// ── Core recharge logic ──
function bonusForCards(plan, n) { return Math.min(n, plan.maxBonus) * plan.bonusPerCard; }

function evalCombo(cA, cB, total) {
if (!cA && !cB) return null;
const chargeA = cA*PA.charge, chargeB = cB*PB.charge;
const charge  = chargeA + chargeB;
const bonusA  = bonusForCards(PA, cA), bonusB = bonusForCards(PB, cB);
const bonus   = bonusA + bonusB;
const avail   = charge + bonus;
if (avail < total) return null;
const remain  = avail - total;
const refund  = remain > 0 ? remain * (charge/avail) : 0;
const netCost = charge - refund;
return { cA, cB, chargeA, chargeB, charge, bonusA, bonusB, bonus, avail, remain, refund, netCost };
}

function chg(d) {
const el = document.getElementById('qty');
el.value = Math.max(1, Math.min(99, +el.value+d));
}

function calc() {
const perItem = parseFloat(document.getElementById('perItem').value);
const qty     = parseInt(document.getElementById('qty').value);
if (!perItem || perItem <= 0) {
const el = document.getElementById('perItem');
el.focus(); el.style.borderColor='var(--red)';
setTimeout(()=>el.style.borderColor='',1500); return;
}
const total   = perItem * qty;
const coupons = readCoupons();
const hbs     = readDiscs('hbList','hbmin','hboff');

const maxA = Math.min(Math.ceil(total/PA.charge)+1, 15);
const maxB = Math.min(Math.ceil(total/PB.charge)+1, 10);
let candidates = [];
for (let a=0; a<=maxA; a++)
for (let b=0; b<=maxB; b++) {
const r = evalCombo(a,b,total); if(r) candidates.push(r);
}

candidates.sort((x,y)=>{
const d=x.netCost-y.netCost; return Math.abs(d)<0.001 ? x.charge-y.charge : d;
});

let pareto=[];
for (const c of candidates) {
if (!pareto.some(p=>p.netCost<=c.netCost+0.001 && p.charge<=c.charge)) pareto.push(c);
}

if (!pareto.length) {
document.getElementById('results').classList.add('show');
document.getElementById('bestBox').innerHTML='<div style="text-align:center;padding:20px;color:var(--gray)">无法找到有效方案</div>';
return;
}

const best=pareto[0], others=pareto.slice(1,4);
renderBest(best, perItem, qty, coupons, hbs);
renderOthers(others, best, perItem, qty);
renderTip(best, perItem, qty, coupons, hbs);

const res=document.getElementById('results');
res.classList.add('show');
setTimeout(()=>res.scrollIntoView({behavior:'smooth',block:'start'}),80);
setTimeout(()=>{
const fa=document.getElementById('bbarA'), fb=document.getElementById('bbarB');
if(fa) fa.style.width=(Math.min(best.cA,PA.maxBonus)/PA.maxBonus*100)+'%';
if(fb) fb.style.width=(Math.min(best.cB,PB.maxBonus)/PB.maxBonus*100)+'%';
},120);
}

function comboName(cA,cB){
if(cA&&cB) return `${cA}张A + ${cB}张B`;
return cA ? `${cA}张方案A` : `${cB}张方案B`;
}
function comboTags(cA,cB){
let h='';
if(cA){ const m=cA>=PA.maxBonus?' maxed':''; h+=`<span class="ctag a${m}">A×${cA} +¥${bonusForCards(PA,cA)}赠${cA>PA.maxBonus?'(封顶)':''}</span>`; }
if(cB){ const m=cB>=PB.maxBonus?' maxed':''; h+=`<span class="ctag b${m}">B×${cB} +¥${bonusForCards(PB,cB)}赠${cB>PB.maxBonus?'(封顶)':''}</span>`; }
return h;
}

function renderBest(b, perItem, qty, coupons, hbs) {
const orderTotal    = perItem * qty;
const pricePerSet   = b.netCost / qty;                          // 购物金折后单套
const { totalOff:couponOff, applied:couponApplied } = applyDiscs(orderTotal, coupons);
const { totalOff:hbOff,     applied:hbApplied     } = applyDiscs(orderTotal, hbs);
const totalDiscOff  = couponOff + hbOff;                        // 券+包 一次性抵扣总额
const finalTotal    = b.netCost - totalDiscOff;                 // 最终实付总价
const finalPerSet   = finalTotal / qty;                         // 最终单套均价
const totalSave     = orderTotal - finalTotal;                  // 总节省（vs 原价）
const savePct       = (totalSave / orderTotal * 100).toFixed(1);
const saveNoDisc    = perItem - pricePerSet;                    // 仅购物金节省/套
const savePctND     = (saveNoDisc / perItem * 100).toFixed(1);
const aUsed=Math.min(b.cA,PA.maxBonus), bUsed=Math.min(b.cB,PB.maxBonus);

const refundRow = b.refund>0.005
? `<div class="best-refund"><span>📤 购完后余额可退回</span><strong>¥${fmt(b.refund)} <span style="font-size:10px;font-weight:400">（余额¥${fmt(b.remain)}）</span></strong></div>`
: '';

// Build discount summary
let discBlock = '';
if (totalDiscOff > 0) {
let couponRows = couponApplied.map(c=>
`<div class="ds-row coupon-row"><span>🎟 优惠券抵扣</span><strong>-¥${fmt(c.off)}</strong></div>`
).join('');
let hbRows = hbApplied.map(h=>
`<div class="ds-row hb-row"><span>🧧 ${h.min>0?'满¥'+fmt(h.min)+'减':'无门槛红包'} ¥${fmt(h.off)}</span><strong>-¥${fmt(h.off)}</strong></div>`
).join('');
discBlock = ` <div class="disc-summary"> <div class="disc-summary-title">🏷 叠加优惠明细（整单一次抵扣）</div> <div class="disc-summary-body"> <div class="ds-row"><span>购物金折后总价</span><strong>¥${fmt(b.netCost)}</strong></div> <div class="ds-divider"></div> ${couponRows}${hbRows} <div class="ds-divider"></div> <div class="ds-total"><span>实付总价</span><span>¥${fmt(finalTotal)}</span></div> </div> </div> <div class="final-hero"> <div class="fh-left"> <div class="fh-label">最终到手均价</div> <div class="fh-sub">总价¥${fmt(finalTotal)} ÷ ${qty}套<br>${couponApplied.length>0?couponApplied.length+'张券-¥'+fmt(couponOff):''}${couponApplied.length>0&&hbApplied.length>0?' · ':''}${hbApplied.length>0?hbApplied.length+'个包-¥'+fmt(hbOff):''}</div> </div> <div class="fh-right"> <div class="fh-price"><span class="yen">¥</span>${fmt(finalPerSet)}</div> <div class="fh-save">原价¥${fmt(perItem)} · 共省¥${fmt(totalSave)} (${savePct}%)</div> </div> </div>`;
}

document.getElementById('bestBox').innerHTML = ` <div class="best-box"> <div class="best-crown-bar"><span>🏆</span> 最优充值方案</div> <div class="best-split"> <div class="best-left"> <div class="best-plan-name">${comboName(b.cA,b.cB)}</div> <div class="best-combo-tags">${comboTags(b.cA,b.cB)}</div> <div class="best-stats"> <div class="bstat">充值 <strong>¥${fmt(b.charge)}</strong></div> <div class="bstat">赠金 <strong>+¥${b.bonus}</strong></div> <div class="bstat">到手 <strong>¥${fmt(b.avail)}</strong></div> </div> </div> <div class="best-right"> <div class="best-price-label">购物金折后单套</div> <div class="best-price"><span class="yen">¥</span>${fmt(pricePerSet)}</div> <div class="best-orig">原价 ¥${fmt(perItem)}</div> <div class="best-save-chip">省 ¥${fmt(saveNoDisc)} (${savePctND}%)</div> </div> </div> <div class="best-breakdown"> <div class="bbd"><span>充值本金</span><strong>¥${fmt(b.charge)}</strong></div> <div class="bbd"><span>共可使用</span><strong>¥${fmt(b.avail)}</strong></div> <div class="bbd"><span>A赠金</span><strong>+¥${b.bonusA}（${aUsed}/${PA.maxBonus}次）</strong></div> <div class="bbd"><span>B赠金</span><strong>+¥${b.bonusB}（${bUsed}/${PB.maxBonus}次）</strong></div> </div> <div class="bonus-bars"> <div class="bbar-row"> <span class="bbar-label a">方案A</span> <div class="bbar-track"><div class="bbar-fill a" id="bbarA" style="width:0%"></div></div> <span class="bbar-val">${aUsed}/${PA.maxBonus} 次</span> </div> <div class="bbar-row"> <span class="bbar-label b">方案B</span> <div class="bbar-track"><div class="bbar-fill b" id="bbarB" style="width:0%"></div></div> <span class="bbar-val">${bUsed}/${PB.maxBonus} 次</span> </div> </div> ${refundRow} ${discBlock} </div>`;
}

function renderOthers(others, best, perItem, qty) {
if (!others.length) {
document.getElementById('runners').innerHTML='<p style="grid-column:1/-1;text-align:center;font-size:12px;color:var(--gray2);padding:10px 0">已是所有有效方案中最优</p>';
return;
}
const cls=['r0','r1','r2'];
let html='';
others.forEach((o,i)=>{
const pps=(o.netCost/qty), extra=(o.netCost-best.netCost)/qty;
const refRow=o.refund>0.005?`<div class="dr"><span>余额可退</span><strong class="rv">¥${fmt(o.refund)}</strong></div>`:
'';
let tags='';
if(o.cA) tags+=`<span class="rtag a">A×${o.cA}(+¥${o.bonusA})</span>`;
if(o.cB) tags+=`<span class="rtag b">B×${o.cB}(+¥${o.bonusB})</span>`;
html+=` <div class="runner-card ${cls[i]||''}"> <div class="runner-rank">第${i+2}优</div> <div class="runner-name">${comboName(o.cA,o.cB)}</div> <div class="rtags">${tags}</div> <div class="runner-price-label">购物金折后单套</div> <div class="runner-price"><span class="yen">¥</span>${fmt(pps)}</div> <div class="runner-extra">比最优多 <b>¥${fmt(extra)}</b>/套</div> <div class="runner-details"> <div class="dr"><span>充值额</span><strong>¥${fmt(o.charge)}</strong></div> <div class="dr"><span>赠金</span><strong>+¥${o.bonus}</strong></div> <div class="dr"><span>到手</span><strong>¥${fmt(o.avail)}</strong></div> ${refRow} </div> </div>`;
});
document.getElementById('runners').innerHTML=html;
}

function renderTip(best, perItem, qty, coupons, hbs) {
const orderTotal = perItem * qty;
const pps = best.netCost / qty;
const {totalOff:co} = applyDiscs(orderTotal, coupons);
const {totalOff:ho} = applyDiscs(orderTotal, hbs);
const finalTotal = best.netCost - co - ho;
const finalPerSet = finalTotal / qty;
const saveTotal = orderTotal - finalTotal;
const lines=[];
if(best.cA&&best.cB) lines.push(`混合充值 <b>${best.cA}张A（¥${best.chargeA}）+ ${best.cB}张B（¥${best.chargeB}）</b>，两档赠金共+¥${best.bonus}`);
else if(best.cA) lines.push(`充 <b>${best.cA}张方案A（共¥${best.chargeA}）</b>，获赠${Math.min(best.cA,PA.maxBonus)}次共+¥${best.bonusA}`);
else lines.push(`充 <b>${best.cB}张方案B（共¥${best.chargeB}）</b>，获赠${Math.min(best.cB,PB.maxBonus)}次共+¥${best.bonusB}`);
if(co>0) lines.push(`整单优惠券一次减 <b>¥${fmt(co)}</b>`);
if(ho>0) lines.push(`整单红包一次减 <b>¥${fmt(ho)}</b>`);
lines.push(`${qty}套合计节省 <b>¥${fmt(saveTotal)}</b>，单套均价 <b>¥${fmt(finalPerSet)}</b>`);
if(best.refund>0.005) lines.push(`购完余额¥${fmt(best.remain)}，本金部分 <b>¥${fmt(best.refund)}</b> 可退款`);
document.getElementById('tipBox').innerHTML='💡 '+lines.join('；')+'。';
}

document.addEventListener('keydown',e=>{if(e.key==='Enter')calc();});
</script>
