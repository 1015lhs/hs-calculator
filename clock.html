<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Multi-Timezone Digital Clock</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      max-width: 1000px;
      width: 100%;
    }

    .header {
      text-align: center;
      color: white;
      margin-bottom: 40px;
    }

    .header h1 {
      font-size: 2.5rem;
      margin-bottom: 10px;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.2);
    }

    .header p {
      font-size: 1rem;
      opacity: 0.9;
    }

    .controls {
      display: flex;
      gap: 10px;
      margin-bottom: 30px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .add-timezone {
      padding: 12px 24px;
      background: white;
      border: none;
      border-radius: 25px;
      font-size: 1rem;
      font-weight: 600;
      color: #667eea;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .add-timezone:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
    }

    .add-timezone:active {
      transform: translateY(0);
    }

    .timezone-selector {
      padding: 12px 16px;
      border: 2px solid white;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.2);
      color: white;
      font-size: 1rem;
      cursor: pointer;
      backdrop-filter: blur(10px);
    }

    .timezone-selector option {
      background: #333;
      color: white;
    }

    .timezone-selector:focus {
      outline: none;
      border-color: #ffeb3b;
      background: rgba(255, 255, 255, 0.3);
    }

    .clocks-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
      margin-bottom: 40px;
    }

    .clock-card {
      background: rgba(255, 255, 255, 0.95);
      border-radius: 15px;
      padding: 30px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
      text-align: center;
      position: relative;
      overflow: hidden;
      animation: slideIn 0.4s ease-out;
    }

    .clock-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: linear-gradient(90deg, #667eea, #764ba2);
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .timezone-name {
      font-size: 1.3rem;
      font-weight: 700;
      color: #333;
      margin-bottom: 8px;
    }

    .timezone-abbr {
      font-size: 0.85rem;
      color: #999;
      margin-bottom: 20px;
      font-weight: 500;
    }

    .digital-clock {
      font-family: 'Courier New', monospace;
      font-size: 3rem;
      font-weight: bold;
      color: #667eea;
      margin-bottom: 12px;
      letter-spacing: 2px;
      font-variant-numeric: tabular-nums;
    }

    .time-detail {
      font-size: 0.95rem;
      color: #666;
      margin-bottom: 15px;
      line-height: 1.6;
    }

    .day-display {
      font-size: 0.9rem;
      color: #999;
      font-style: italic;
    }

    .remove-btn {
      position: absolute;
      top: 12px;
      right: 12px;
      background: #ff6b6b;
      color: white;
      border: none;
      border-radius: 50%;
      width: 32px;
      height: 32px;
      font-size: 1.2rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.2s, background 0.2s;
      opacity: 0;
    }

    .clock-card:hover .remove-btn {
      opacity: 1;
    }

    .remove-btn:hover {
      background: #ff5252;
      transform: rotate(90deg);
    }

    .empty-state {
      grid-column: 1 / -1;
      text-align: center;
      padding: 60px 20px;
      color: white;
    }

    .empty-state h2 {
      font-size: 1.8rem;
      margin-bottom: 10px;
      opacity: 0.8;
    }

    .empty-state p {
      font-size: 1rem;
      opacity: 0.7;
    }

    .preset-buttons {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
      margin-bottom: 30px;
    }

    .preset-btn {
      padding: 10px 20px;
      background: rgba(255, 255, 255, 0.2);
      border: 2px solid white;
      color: white;
      border-radius: 20px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      backdrop-filter: blur(10px);
    }

    .preset-btn:hover {
      background: rgba(255, 255, 255, 0.3);
      transform: translateY(-2px);
    }

    @media (max-width: 768px) {
      .header h1 {
        font-size: 1.8rem;
      }

      .clocks-grid {
        grid-template-columns: 1fr;
      }

      .digital-clock {
        font-size: 2.2rem;
      }

      .preset-buttons {
        gap: 8px;
      }

      .preset-btn {
        padding: 8px 16px;
        font-size: 0.85rem;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>🌍 World Clock</h1>
      <p>Track time across multiple time zones in real-time</p>
    </div>

    <div class="controls">
      <select class="timezone-selector" id="timezoneSelect">
        <option value="">Select a timezone to add...</option>
      </select>
      <button class="add-timezone" onclick="addTimezone()">+ Add Timezone</button>
    </div>

    <div class="preset-buttons">
      <button class="preset-btn" onclick="loadPreset('major')">Major Cities</button>
      <button class="preset-btn" onclick="loadPreset('clear')">Clear All</button>
    </div>

    <div class="clocks-grid" id="clocksGrid">
      <div class="empty-state">
        <h2>No timezones yet</h2>
        <p>Select a timezone above and click "Add Timezone" to get started</p>
      </div>
    </div>
  </div>

  <script>
    // Comprehensive timezone list
    const TIMEZONES = [
      { name: 'UTC', offset: 0 },
      { name: 'GMT', offset: 0 },
      { name: 'London (GMT/BST)', offset: 0 },
      { name: 'Lisbon (WET/WEST)', offset: 0 },
      { name: 'Central European (CET/CEST)', offset: 1 },
      { name: 'Paris (CET/CEST)', offset: 1 },
      { name: 'Berlin (CET/CEST)', offset: 1 },
      { name: 'Rome (CET/CEST)', offset: 1 },
      { name: 'Madrid (CET/CEST)', offset: 1 },
      { name: 'Moscow (MSK)', offset: 3 },
      { name: 'Istanbul (EET)', offset: 2 },
      { name: 'Cairo (EET)', offset: 2 },
      { name: 'Dubai (GST)', offset: 4 },
      { name: 'India (IST)', offset: 5.5 },
      { name: 'Bangkok (ICT)', offset: 7 },
      { name: 'Hong Kong (HKT)', offset: 8 },
      { name: 'Shanghai (CST)', offset: 8 },
      { name: 'Singapore (SGT)', offset: 8 },
      { name: 'Tokyo (JST)', offset: 9 },
      { name: 'Sydney (AEDT/AEST)', offset: 10 },
      { name: 'Auckland (NZDT/NZST)', offset: 12 },
      { name: 'Los Angeles (PST/PDT)', offset: -8 },
      { name: 'Denver (MST/MDT)', offset: -7 },
      { name: 'Chicago (CST/CDT)', offset: -6 },
      { name: 'New York (EST/EDT)', offset: -5 },
      { name: 'Toronto (EST/EDT)', offset: -5 },
      { name: 'Mexico City (CST/CDT)', offset: -6 },
      { name: 'São Paulo (BRT/BRST)', offset: -3 },
      { name: 'Buenos Aires (ART)', offset: -3 },
      { name: 'Anchorage (AKST/AKDT)', offset: -9 },
      { name: 'Honolulu (HST)', offset: -10 },
    ];

    const MAJOR_CITIES = [
      'New York (EST/EDT)',
      'London (GMT/BST)',
      'Tokyo (JST)',
      'Sydney (AEDT/AEST)',
      'Dubai (GST)',
      'Hong Kong (HKT)',
    ];

    let activeTimezones = [];

    function initializeSelect() {
      const select = document.getElementById('timezoneSelect');
      TIMEZONES.forEach(tz => {
        const option = document.createElement('option');
        option.value = tz.name;
        option.textContent = tz.name;
        select.appendChild(option);
      });
    }

    function addTimezone() {
      const select = document.getElementById('timezoneSelect');
      const selectedName = select.value;

      if (!selectedName) {
        alert('Please select a timezone');
        return;
      }

      if (activeTimezones.some(tz => tz.name === selectedName)) {
        alert('This timezone is already displayed');
        return;
      }

      const timezone = TIMEZONES.find(tz => tz.name === selectedName);
      activeTimezones.push({ ...timezone, id: Date.now() });
      select.value = '';
      updateDisplay();
    }

    function removeTimezone(id) {
      activeTimezones = activeTimezones.filter(tz => tz.id !== id);
      updateDisplay();
    }

    function loadPreset(type) {
      if (type === 'clear') {
        activeTimezones = [];
      } else if (type === 'major') {
        activeTimezones = MAJOR_CITIES.map(name => {
          const timezone = TIMEZONES.find(tz => tz.name === name);
          return { ...timezone, id: Date.now() + Math.random() };
        });
      }
      updateDisplay();
    }

    function formatTime(date, offset) {
      const utc = date.getTime() + date.getTimezoneOffset() * 60000;
      const newDate = new Date(utc + 3600000 * offset);

      const hours = String(newDate.getHours()).padStart(2, '0');
      const minutes = String(newDate.getMinutes()).padStart(2, '0');
      const seconds = String(newDate.getSeconds()).padStart(2, '0');

      return { hours, minutes, seconds, date: newDate };
    }

    function updateDisplay() {
      const grid = document.getElementById('clocksGrid');

      if (activeTimezones.length === 0) {
        grid.innerHTML = `
          <div class="empty-state">
            <h2>No timezones yet</h2>
            <p>Select a timezone above and click "Add Timezone" to get started</p>
          </div>
        `;
        return;
      }

      const now = new Date();
      grid.innerHTML = activeTimezones.map(tz => {
        const { hours, minutes, seconds, date } = formatTime(now, tz.offset);
        const dayName = date.toLocaleDateString('en-US', { weekday: 'long' });
        const dateName = date.toLocaleDateString('en-US', {
          month: 'short',
          day: 'numeric',
          year: 'numeric',
        });

        return `
          <div class="clock-card">
            <button class="remove-btn" onclick="removeTimezone(${tz.id})">×</button>
            <div class="timezone-name">${tz.name.split('(')[0].trim()}</div>
            <div class="timezone-abbr">${tz.name.split('(')[1]?.replace(')', '') || 'UTC'}</div>
            <div class="digital-clock">${hours}:${minutes}:${seconds}</div>
            <div class="time-detail">
              <div>${dayName}</div>
              <div class="day-display">${dateName}</div>
            </div>
          </div>
        `;
      }).join('');
    }

    function tick() {
      if (activeTimezones.length === 0) return;

      const now = new Date();
      const cards = document.querySelectorAll('.clock-card');

      cards.forEach((card, index) => {
        const tz = activeTimezones[index];
        if (!tz) return;

        const { hours, minutes, seconds } = formatTime(now, tz.offset);
        const clockElement = card.querySelector('.digital-clock');
        if (clockElement) {
          clockElement.textContent = `${hours}:${minutes}:${seconds}`;
        }
      });
    }

    // Initialize
    initializeSelect();
    loadPreset('major');
    setInterval(tick, 1000);
  </script>
</body>
</html>
